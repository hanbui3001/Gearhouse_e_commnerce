services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: e_commerce_management
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  backend:
    image: hanbui3001/gearhouse:1.2
    container_name: gearhouse_service
    ports:
      - "8080:8080"
    env_file:
      - ../.env.prod
    networks:
      - app-network
volumes:
  mysql_data:
  redis_data:
networks:
  app-network:
